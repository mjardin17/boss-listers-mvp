name: Card Factory local staging

on:
  pull_request:
    paths:
      - "scripts/card-factory-local/**"
      - "package.json"
      - ".github/workflows/card-factory-local.yml"
  push:
    branches:
      - recovery/card-factory-desktop-companion
    paths:
      - "scripts/card-factory-local/**"
      - "package.json"
      - ".github/workflows/card-factory-local.yml"

permissions:
  contents: read

jobs:
  local-staging-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.16.0"
      - name: Run isolated local staging tests
        run: npm run test:card-factory-local
