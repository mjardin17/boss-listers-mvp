services:
  - type: web
    name: boss-listers-mvp
    runtime: node
    plan: starter
    branch: main
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    disk:
      name: boss-listers-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4o-mini
      - key: DATA_DIR
        value: /var/data/store
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_BASIC_AUTH_USER
        sync: false
      - key: APP_BASIC_AUTH_PASS
        sync: false
      - key: RATE_LIMIT_MAX
        value: 10
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: MAX_VISION_CALLS_PER_REQUEST
        value: 3
