<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 320px; padding: 14px; margin: 0; background: #0f172a; color: #f8fafc; }
    h1 { font-size: 14px; font-weight: 700; color: #38bdf8; margin: 0 0 10px; }
    section { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #1e293b; }
    section:last-of-type { border-bottom: none; }
    label { display: block; font-size: 11px; color: #94a3b8; margin: 6px 0 2px; }
    input { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; padding: 6px 8px; font-size: 12px; }
    button { width: 100%; margin-top: 8px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #334155; color: #f8fafc; }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { font-size: 11px; color: #94a3b8; margin-top: 8px; line-height: 1.4; white-space: pre-wrap; }
    #status.error { color: #f87171; }
    #status.ok { color: #4ade80; }
    #itemList { max-height: 140px; overflow-y: auto; margin-top: 6px; }
    .item-row { font-size: 11px; padding: 5px 6px; border-radius: 4px; cursor: pointer; }
    .item-row:hover { background: #1e293b; }
    .platform-badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 9999px; background: #1e293b; color: #38bdf8; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Boss Listers Autofill</h1>

  <section>
    <label>API base URL (your Boss Listers app)</label>
    <input id="apiBaseUrl" type="text" placeholder="http://localhost:3001">
    <label>Basic auth username</label>
    <input id="authUser" type="text" autocomplete="off">
    <label>Basic auth password</label>
    <input id="authPass" type="password" autocomplete="off">
    <button id="saveSettings" class="secondary">Save connection</button>
  </section>

  <section>
    <label>SKU to fill</label>
    <input id="sku" type="text" placeholder="e.g. AP-ROOKIE-01">
    <button id="loadRecent" class="secondary">Load recent inventory</button>
    <div id="itemList"></div>
  </section>

  <section>
    <div class="platform-badge" id="platformBadge">detecting platform…</div>
    <button id="fillBtn">Fetch package &amp; fill this page</button>
    <button id="postEverywhereBtn" class="secondary" style="margin-top: 8px;">Post to ALL platforms</button>
  </section>

  <div id="status">For single platform: fills form for review. For all platforms: auto-submits after filling (skips manual review).</div>

  <script src="popup.js"></script>
</body>
</html>
